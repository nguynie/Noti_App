name: Facebook Page Notifier

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows running manually from GitHub UI

concurrency:
  group: facebook-notifier
  cancel-in-progress: false

jobs:
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push updated seen_posts.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Scan Facebook pages and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          AUTO_BASELINE_FIRST_RUN: 'true'
          REQUEST_DELAY_SECONDS: '2'
        run: |
          python3 main.py --once

      - name: Commit and save updated seen posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen posts [skip ci]" && git push)
